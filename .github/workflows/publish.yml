          with open("blog.html", "w") as f:
              f.write(html)

          print(f"blog.html regenerated: {pub_count} published, {soon_count} coming soon")
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "Lemon Law Handbook Bot"
          git config user.email "action@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Auto-published articles + regenerated blog.html for $(date -u '+%Y-%m-%d')"
            git push
            echo "Pushed — Netlify will redeploy automatically"
          fi
